<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spine asset verification</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151f22}body{display:grid;place-items:center}canvas{display:block}</style>
<canvas></canvas><script src="../node_modules/spine-player-4-0/dist/iife/spine-player.js"></script><script>
(async()=>{
  const name=new URLSearchParams(location.search).get('image')||'image_1';
  const manifest=await fetch('../docs/player-spine/manifest.json').then(r=>r.json());
  const definition=manifest.pages.find(page=>page.name===name);if(!definition)throw new Error('Unknown image');
  const canvas=document.querySelector('canvas'),ratio=Math.min(innerWidth/1920,innerHeight/1080);
  canvas.width=Math.round(1920*ratio);canvas.height=Math.round(1080*ratio);
  const context=new spine.ManagedWebGLRenderingContext(canvas,{alpha:false,premultipliedAlpha:false,antialias:true,preserveDrawingBuffer:true});
  const renderer=new spine.SceneRenderer(canvas,context,false);
  renderer.camera.viewportWidth=definition.viewport.width;renderer.camera.viewportHeight=definition.viewport.height;renderer.camera.position.set(0,0,0);renderer.camera.update();
  const base=new URL('../asserts/player/'+name+'/',location.href);
  const atlas=new spine.TextureAtlas(await fetch(new URL(name+'.atlas',base)).then(r=>r.text()));
  async function loadImage(url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=url})}
  for(const page of atlas.pages)page.setTexture(new spine.GLTexture(context,await loadImage(new URL(page.name,base).href)));
  const raw=await fetch(new URL(name+'.json',base)).then(r=>r.json());
  const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(raw),skeleton=new spine.Skeleton(data);
  function draw(time){skeleton.setToSetupPose();data.findAnimation('loop').apply(skeleton,-1,time,true,null,1,spine.MixBlend.replace,spine.MixDirection.mixIn);skeleton.updateWorldTransform();context.gl.viewport(0,0,canvas.width,canvas.height);context.gl.clearColor(0,0,0,1);context.gl.clear(context.gl.COLOR_BUFFER_BIT);renderer.begin();renderer.drawSkeleton(skeleton,false);renderer.end()}
  function pixels(){const result=new Uint8Array(canvas.width*canvas.height*4);context.gl.readPixels(0,0,canvas.width,canvas.height,context.gl.RGBA,context.gl.UNSIGNED_BYTE,result);return result}
  function diff(a,b){let sum=0,max=0,changed=0;for(let i=0;i<a.length;i+=4){let different=false;for(let c=0;c<3;c++){const d=Math.abs(a[i+c]-b[i+c]);sum+=d;max=Math.max(max,d);different||=d>2}changed+=different?1:0}return{meanAbsoluteChannelError:sum/(a.length/4*3),maximum:max,changedPixels:changed,pixelCount:a.length/4}}
  const thumb=document.createElement('canvas');thumb.width=480;thumb.height=270;const painter=thumb.getContext('2d',{willReadFrequently:true});
  painter.drawImage(await loadImage(new URL('../asserts/player/images/'+name+'.png',location.href).href),0,0,480,270);const reference=painter.getImageData(0,0,480,270).data;
  function check(){draw(0);const first=pixels();draw(1.25);const motion=diff(first,pixels());let bestReference={meanAbsoluteChannelError:Infinity};for(let tick=0;tick<60;tick++){const time=tick/6;draw(time);painter.drawImage(canvas,0,0,480,270);const sample=diff(painter.getImageData(0,0,480,270).data,reference);if(sample.meanAbsoluteChannelError<bestReference.meanAbsoluteChannelError)bestReference={time,...sample}}draw(bestReference.time);return{mode:'retained-pack-without-deleted-source',comparisons:[],motion,bestReference,canvas:{width:canvas.width,height:canvas.height},glError:context.gl.getError(),contextLost:context.gl.isContextLost()}}
  draw(0);window.playerSpine={ready:true,renderAt:draw,check};
})().catch(error=>{window.playerSpine={error:String(error)};console.error(error)});
</script></html>
